# Configuração das ferramentas (o projeto não é um pacote instalável).
[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = ["elc6012net_local/app", "elc6012net_hibrido/app"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# estilo compacto do relay (vários comandos curtos por linha) é intencional
ignore = ["E501", "E701", "E702", "E731"]
