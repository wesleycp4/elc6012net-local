name: ELC 6012 NET Local
version: "1.0.1"
slug: elc6012net_local
description: Controle 100% local (sem nuvem) do eletrificador Intelbras ELC 6012 NET, com Home Assistant via MQTT
url: https://github.com/wesleycp4/elc6012net-local
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: manual
# Credenciais do broker vêm do Supervisor (App Mosquitto): nada a configurar.
services:
  - mqtt:need
# A central conecta aqui (no lugar da nuvem Intelbras).
ports:
  9009/tcp: 9009
ports_description:
  9009/tcp: Conexão da central (redirecione o servidor da nuvem para o IP do HA)
options:
  poll: 5
  node: elc6012_local
  name: ELC 6012 NET (local)
schema:
  poll: int(2,600)
  node: match(^[a-z0-9_]+$)
  name: str
