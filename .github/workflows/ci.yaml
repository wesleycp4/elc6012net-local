name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff "paho-mqtt>=2.1,<3"
      - name: Lint
        run: ruff check .
      - name: Cópias do relay nos Apps
        run: python scripts/sync_apps.py --check
      - name: Testes
        run: python -m unittest discover -s tests -t . -v

  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [elc6012net_local, elc6012net_hibrido]
    steps:
      - uses: actions/checkout@v4
      - name: Lint do App (Home Assistant)
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.app }}"
      - name: Lint do Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "${{ matrix.app }}/Dockerfile"
          ignore: DL3006,DL3013,DL3018
      - name: Shellcheck do run.sh
        run: shellcheck -x "${{ matrix.app }}/run.sh"
